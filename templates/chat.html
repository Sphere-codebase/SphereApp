<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claims Assistant - Chat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
  </head>
  <body class="bg-slate">
    <div class="container-fluid py-3 h-100">
      <div class="row h-100">
        <aside class="col-12 col-lg-3 mb-3 mb-lg-0">
          <div class="card h-100">
            <div class="card-body">
              <h2 class="h5">Sessions</h2>
              <p class="text-muted small">Recent chats will appear here.</p>
              <ul class="list-group list-group-flush" id="session-list">
                <li class="list-group-item">Current session</li>
              </ul>
            </div>
          </div>
        </aside>
        <section class="col-12 col-lg-9">
          <div class="card h-100 d-flex flex-column">
            <div class="card-body flex-grow-1 overflow-auto" id="chat-thread">
              <div class="text-muted small">Start by asking about a claim.</div>
            </div>
            <div class="card-footer">
              <form id="chat-form" class="d-flex gap-2">
                <input
                  type="text"
                  class="form-control"
                  id="chat-input"
                  placeholder="Ask about a claim..."
                  required
                />
                <button type="submit" class="btn btn-primary">Send</button>
              </form>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="{{ url_for('static', path='js/chat.js') }}"></script>
  </body>
</html>
