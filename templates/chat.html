<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claims Assistant - Chat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
  </head>
  <body class="bg-slate">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-3">
      <div class="container-fluid">
        <span class="navbar-brand">Claims Assistant</span>
        <div class="d-flex align-items-center gap-2">
          {% if user.is_admin %}
          <a class="btn btn-sm btn-outline-primary" href="/app/admin/users">Admin Users</a>
          {% endif %}
          <button class="btn btn-sm btn-outline-danger" id="logout-button">Logout</button>
        </div>
      </div>
    </nav>
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>
    <div class="container-fluid py-3 h-100">
      <div class="row h-100">
        <aside class="col-12 col-lg-3 mb-3 mb-lg-0">
          <div class="card h-100">
            <div class="card-body">
              <div class="mb-3" id="status-card">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="text-uppercase text-muted small">System</span>
                  <span class="badge bg-secondary" id="status-overall">...</span>
                </div>
                <div class="small mb-1">
                  Agent
                  <span class="badge bg-secondary ms-1" id="status-agent">...</span>
                </div>
                <div class="small mb-1">
                  DB
                  <span class="badge bg-secondary ms-1" id="status-db">...</span>
                </div>
                <div class="small text-muted" id="status-checked">Checked: --:--</div>
                <div class="small mt-2">
                  <div><span class="text-muted">Model:</span> <span id="status-model">-</span></div>
                  <div><span class="text-muted">Host:</span> <span id="status-host">-</span></div>
                  <div><span class="text-muted">Max steps:</span> <span id="status-steps">-</span></div>
                </div>
              </div>
              <div class="d-flex align-items-center justify-content-between mb-2">
                <h2 class="h5 mb-0">Sessions</h2>
                <button class="btn btn-sm btn-outline-primary" id="new-session-button">
                  + New session
                </button>
              </div>
              <p class="text-muted small">Recent chats will appear here.</p>
              <ul class="list-group list-group-flush" id="session-list">
                <li class="list-group-item text-muted">No sessions yet.</li>
              </ul>
            </div>
          </div>
        </aside>
        <section class="col-12 col-lg-9">
          <div class="card h-100 d-flex flex-column">
            <div class="card-body flex-grow-1 overflow-auto" id="chat-thread">
              <div class="text-muted small">Start by asking about a claim.</div>
            </div>
            <div class="card-footer">
              <form id="chat-form" class="d-flex gap-2">
                <input
                  type="text"
                  class="form-control"
                  id="chat-input"
                  placeholder="Ask about a claim..."
                  required
                />
                <button type="submit" class="btn btn-primary">Send</button>
              </form>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="{{ url_for('static', path='js/chat_helpers.js') }}"></script>
    <script src="{{ url_for('static', path='js/chat.js') }}"></script>
  </body>
</html>
