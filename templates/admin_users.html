<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claims Assistant - Admin Users</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
  </head>
  <body class="bg-slate">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container-fluid">
        <span class="navbar-brand">Claims Assistant</span>
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-sm btn-outline-secondary" href="/app/chat">Chat</a>
          {% if user.is_admin %}
          <a class="btn btn-sm btn-outline-primary" href="/app/admin/users">Admin Users</a>
          {% endif %}
          <button class="btn btn-sm btn-outline-danger" id="logout-button">Logout</button>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="h4 mb-3">Create user</h1>
              <p class="text-muted small">
                Users created here belong to your tenant. Use role to grant admin access.
              </p>
              <form id="admin-user-form">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="admin-email" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="admin-email"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="admin-name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="admin-name" />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="admin-password" class="form-label">Password</label>
                    <input
                      type="password"
                      class="form-control"
                      id="admin-password"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="admin-role" class="form-label">Role (optional)</label>
                    <select class="form-select" id="admin-role">
                      <option value="">Member</option>
                      <option value="admin">Admin</option>
                    </select>
                  </div>
                </div>
                <div class="alert alert-success d-none" id="admin-success"></div>
                <div class="alert alert-danger d-none" id="admin-error"></div>
                <button type="submit" class="btn btn-primary">Create user</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="{{ url_for('static', path='js/admin_users.js') }}"></script>
  </body>
</html>
