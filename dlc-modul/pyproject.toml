[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-parser-app"
version = "0.1.0"
description = "Policy parser service (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "httpx==0.27.2",
  "beautifulsoup4==4.12.3",
  "lxml==5.3.0",
  "pydantic==2.10.3",
  "pytest==8.3.4",
  "pdfplumber==0.11.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "httpx==0.27.2",
  "ruff==0.8.4",
  "mypy==1.13.0",
  "types-passlib==1.7.7.20240819",
]

[tool.setuptools]
# КРИТИЧНО: фикс для "Multiple top-level packages"
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["docker*", "tests*", "scripts*", "docs*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
