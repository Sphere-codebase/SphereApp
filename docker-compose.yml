services:
  postgres:
    image: postgres:16
    container_name: claims_assistant_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claims_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claims_assistant"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
