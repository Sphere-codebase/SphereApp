name: Docker Build Validation

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to GHCR"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sphereapp
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Ruff check
        run: ruff check . --output-format=github
      - name: Ruff format check
        run: ruff format --check .

  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claims_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d claims_assistant"
          --health-interval=1s
          --health-timeout=3s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push_image == 'true' }}
          tags: |
            sphereapp:ci
            ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/claims_assistant
          JWT_SECRET: ci-secret
          LLM_BASE_URL: http://localhost:1234/v1
        run: |
          set -euo pipefail
          docker run -d --name sphereapp-ci --network host -p 8000:8000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e LLM_BASE_URL="$LLM_BASE_URL" \
            sphereapp:ci
          trap 'docker logs --tail=200 sphereapp-ci || true; docker stop sphereapp-ci || true' EXIT
          ready=0
          for _ in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Health check did not become ready in time"
            exit 1
          fi
          curl -i http://localhost:8000/health
          curl -i http://localhost:8000/ready
