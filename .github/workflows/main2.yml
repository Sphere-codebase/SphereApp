name: Docker build & test

on:
  push:
    branches: ["main"]
  pull_request:

env:
  IMAGE_NAME: SphereApp
  PYTHON_VERSION: "3.11"
  # For python code (runs on the GH runner)
  DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/claims_assistant"
  # Make CI deterministic
  ENV: "test"
  JWT_SECRET: "ci-secret"
  READY_CHECK_LLM: "false"

jobs:
  docker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claims_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d claims_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Install postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d claims_assistant && exit 0
            echo "waiting for postgres ($i/30)..."
            sleep 2
          done
          echo "Postgres did not become ready"
          exit 1

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        working-directory: ${{ github.workspace }}
        run: |
          python -m alembic -c alembic.ini upgrade head

      - name: Format (ruff)
        run: |
          .venv/bin/ruff format . || ruff format .

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check . || ruff check .

      - name: Run tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          .venv/bin/pytest -q -rs || pytest -q -rs

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:ci .

      - name: Run container (smoke)
        run: |
          docker run -d --rm \
            -p 8000:8000 \
            --name sphereapp_ci \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL="postgresql+psycopg://postgres:postgres@host.docker.internal:5432/claims_assistant" \
            -e ENV="${ENV}" \
            -e JWT_SECRET="${JWT_SECRET}" \
            -e READY_CHECK_LLM="${READY_CHECK_LLM}" \
            $IMAGE_NAME:ci

      - name: Wait for /health
        run: |
          set -e
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "health ok"
              break
            fi
            echo "waiting for app ($i/30)..."
            sleep 2
          done

          if ! curl -fsS http://localhost:8000/health > /dev/null; then
            echo "App did not become healthy"
            docker logs sphereapp_ci || true
            exit 1
          fi

      - name: Smoke /ready
        run: |
          curl -fsS http://localhost:8000/ready

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs sphereapp_ci || true

      - name: Stop container
        if: always()
        run: |
          docker stop sphereapp_ci || true
